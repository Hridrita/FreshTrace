name: FreshTrace CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Clients
        run: |
          npx prisma generate
          node scripts/make-test-schema.mjs
          npx prisma generate --schema=prisma/schema.sqlite.prisma

      - name: Build Application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # The action defaults to vercel@25.1.0, which cannot resolve a
          # project from VERCEL_ORG_ID/VERCEL_PROJECT_ID alone and fails with
          # "Could not retrieve Project Settings" — there is no linked
          # .vercel/project.json in CI, because that directory is git-ignored.
          # Vercel CLI 31 is the first release that honours those environment
          # variables, so the CLI is pinned explicitly.
          vercel-version: '31.0.0'
          vercel-args: '--prod'