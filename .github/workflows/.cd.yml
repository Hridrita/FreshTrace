name: FreshTrace CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Clients
        run: |
          npx prisma generate
          node scripts/make-test-schema.mjs
          npx prisma generate --schema=prisma/schema.sqlite.prisma

      - name: Build Application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # The Vercel project pins Node.js 26.x, and the CLI has to understand
          # that version to build it. Vercel CLI 64 is the first release that
          # accepts Node.js 26; older CLIs abort with "Found invalid Node.js
          # Version: 26.x", and CLI 25 (the v25 action's default) cannot even
          # resolve a project from VERCEL_ORG_ID/VERCEL_PROJECT_ID, because CI
          # has no linked .vercel/project.json — that directory is git-ignored.
          vercel-version: '65.8.0'
          vercel-args: '--prod'
          # github-comment defaults to true, and it needs a token to post to.
          github-token: ${{ secrets.GITHUB_TOKEN }}